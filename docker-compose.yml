services:
  vehicle:
    build: .
    command: ["--frames", "60", "--device", "cpu", "--llm", "--llm-endpoint", "http://llm-analyzer:8000/analyze", "--http-timeout-ms", "65000", "--mqtt", "--mqtt-broker", "tcp://mqtt-broker:1883", "--mqtt-topic-prefix", "vehicle/vehicle-001"]
    depends_on:
      - llm-analyzer
      - mqtt-broker

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  llm-analyzer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./python:/app:ro
    environment:
      ARK_API_BASE_URL: ${ARK_API_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-0-mini-260428}
      ARK_TIMEOUT_SECONDS: ${ARK_TIMEOUT_SECONDS:-60}
    command: ["python", "llm_behavior_analyzer.py", "serve", "8000"]
    ports:
      - "8000:8000"
